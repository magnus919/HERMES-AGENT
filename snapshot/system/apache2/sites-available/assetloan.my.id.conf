<VirtualHost *:80>
    ServerName assetloan.my.id
    DocumentRoot /var/www/assetloan.my.id

    <Directory /var/www/assetloan.my.id>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/assetloan.my.id_error.log
    CustomLog ${APACHE_LOG_DIR}/assetloan.my.id_access.log combined
</VirtualHost>
